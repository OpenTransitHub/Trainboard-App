<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Am Bahnhof  - Trainboard</title>
	<link rel="shortcut icon" type="image/x-icon" href="./branding/favicon.ico">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/dark-styles.css">
	<meta name="robots" content="noindex">
	<meta name="theme-color" content="#e3e3e3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

	<script src="./script/station.js" defer></script>
	<script src="./script/i18n.js"></script>
</head>
<body>

	<div class="glowbar"></div>
	
	<center>
	<main>
		<a href="#" onclick="history.go(-1)"><div class="backbutton"></div></a>
		<span class="toptitle" id="toptitle" style="width: calc(100% - 100px);">Station</span>
		<a id="switchlink"><div class="rightbutton" style="margin-right: 10px; background-image: url(./icons/accessibility.svg);"></div></a>
		
		<br><br><br>

		<center><p><canvas id="billing-loader"></canvas></p></center>

		<div class="hidden" id="retarder">

		<div class="headercontainer">
			<div class="leftpane">
				<div id="stationimg"></div>
			</div>
			<div class="rightpane">
				<div class="listelement-container">
					<div class="trip-message-item">
						<a id="mapslink" target="_blank">
							<table>
								<tbody><tr class="wide">
									<td><div class="listelementicon" style="background-image: url('./icons/explore.svg');"></div></td>
									<td class="wide"><strong id="adress"></strong><br><small class="secondary" id="postcode"></small></td>
								</tr>
							</tbody></table>
						</a>
					</div>
					<div class="trip-message-item">
						<a id="sevlink" target="_blank">
							<table>
								<tbody><tr class="wide">
									<td><div class="listelementicon" style="background-image: url('./icons/sevlogo.svg');"></div></td>
									<td class="wide"><strong>Umgebungsplan</strong><br><small class="secondary">Zugang zum SEV</small></td>
								</tr>
							</tbody></table>
						</a>
					</div>
					<div class="trip-message-item">
						<a id="weather">
							<table>
								<tbody><tr class="wide">
									<td><div class="listelementicon" id="weathericon"></div></td>
									<td class="wide" id="weatherbox"><strong id="temperature"></strong><br><small class="secondary" id="condition"></small></td>
								</tr>
							</tbody></table>
						</a>
					</div>
				</div>
			</div>
		</div>

	<br>
	<small class="secondary bold hidden" id="amenetieslabel">Ausstattung</small>
		<div class="listelement-container" id="amanetiesection">
			
		</div>

	<br>
	
	<small class="secondary bold hidden" id="serviceslabel">Services</small>
		<div class="listelement-container" id="servicessection">
			
		</div>
	
	</div>

	<br>

	<small class="secondary bold hidden" id="otherslabel">Sonstige</small>
		<div class="listelement-container" id="otherssection">
			
		</div>
	
	</div>
	
	</main>


	<script type="module">
		import {
			M3Animator,
			getMorphedShape,
			drawIndicator,
			setupCanvas,
		} from "https://cdn.jsdelivr.net/npm/@alerix/m3-loading-indicator/dist/core/index.js";
		const canvas = document.querySelector("#billing-loader");
		const size = 56;
		// Set up a HiDPI-aware 2D canvas context.
		const ctx = setupCanvas(canvas, size);
		// Create the animation controller.
		const animator = new M3Animator();
		function renderBillingLoader(timestamp) {
			animator.update(timestamp);
			// Convert the current morph value into a drawable shape.
			const shape = getMorphedShape(animator.morph);
			drawIndicator(ctx, size, shape, animator.rotation, {
			color: "#5a5a5a",
			sizeRatio: 0.8,
			contained: false
			});
			requestAnimationFrame(renderBillingLoader);
		}
		requestAnimationFrame(renderBillingLoader);
</script>
</body>
</html>
