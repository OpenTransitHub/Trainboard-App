<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fahrt - Trainboard</title>
	<link rel="shortcut icon" type="image/x-icon" href="./branding/favicon.ico">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/dark-styles.css">
	<meta name="robots" content="noindex">
	<meta name="theme-color" content="#e3e3e3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=info,link_2" />
	
	<!-- Mapbox GL JS -->
	<script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
	<link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />

	<script src="./script/trip.js" defer></script>
	<script src="./script/i18n.js"></script>
</head>
<body>

	<div class="glowbar"></div>
	
    <center>
	<main>

		
		<a href="#" onclick="history.go(-1)"><div class="backbutton extraspacing" id="backbutton"></div></a>
		<a href=""><div class="rightbutton" style="margin-right: 10px; background-image: url(./icons/refresh.svg);"></div></a>

        <section id="map-section">
			<div id="map" style="width: 100%; height: 400px; border-radius: 8px;"></div>
		</section>

		<div id="tripdetails"></div>

	

		

		<section id="stops-section" style="margin-bottom: 20px;">
			<div id="stops-container"><center><p><canvas id="billing-loader"></canvas></p></center></div>
		</section>

        <!-- Container für Meldungen -->
		<section id="messages-section" style="margin-bottom: 20px;">
			<div id="messages-title"></div>
			<div id="messages-container"></div>
		</section>

		
	</main>

	
    <script type="module">
		import {
			M3Animator,
			getMorphedShape,
			drawIndicator,
			setupCanvas,
		} from "https://cdn.jsdelivr.net/npm/@alerix/m3-loading-indicator/dist/core/index.js";
		const canvas = document.querySelector("#billing-loader");
		const size = 56;
		// Set up a HiDPI-aware 2D canvas context.
		const ctx = setupCanvas(canvas, size);
		// Create the animation controller.
		const animator = new M3Animator();
		function renderBillingLoader(timestamp) {
			animator.update(timestamp);
			// Convert the current morph value into a drawable shape.
			const shape = getMorphedShape(animator.morph);
			drawIndicator(ctx, size, shape, animator.rotation, {
			color: "#5a5a5a",
			sizeRatio: 0.8,
			contained: false
			});
			requestAnimationFrame(renderBillingLoader);
		}
		requestAnimationFrame(renderBillingLoader);
</script>
</body>
</html>
